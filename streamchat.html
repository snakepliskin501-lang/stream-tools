function getSmartReplies(msg) {
  const m = msg.toLowerCase();
  if (m.match(/die|died|dead|death|rip|respawn|lose|lost/)) return smartResponses.death;
  if (m.match(/kill|killed|slayed|destroyed|deleted|bodied|rekt/)) return smartResponses.kill;

  if (m.match(/mission|quest|objective|complete|done|finished|cleared/)) return smartResponses.mission;
  if (m.match(/lol|lmao|haha|funny|hilarious/)) return smartResponses.lol;
  if (m.match(/how|what|why|when|where|who/)) return smartResponses.question;
  if (m.match(/yes|yeah|true|agree|exactly|right|facts/)) return smartResponses.agree;
  if (m.match(/game|graphics|combat|animation|world|map|build|class/)) return smartResponses.game;
  if (m.match(/hype|lets go|poggers|pog|fire|insane|crazy|wow|sick/)) return smartResponses.hype;
  return smartResponses.general;
}

  isReplying = false;
  if(inputEl) inputEl.disabled = false;
  if(sendBtn) sendBtn.disabled = false;
  if(inputEl) inputEl.focus();
}


// -- POLL SYSTEM --
const POLL_COLORS = ['#ff4500','#1e90ff','#44ff88','#ffdd44','#dd44ff'];
let activePoll = null;

function parsePoll(input) {
  // Format: !poll Question | Option1 | Option2 | Option3
  const parts = input.replace(/^!poll\s*/i, '').split('|').map(s => s.trim()).filter(Boolean);
  if (parts.length < 3) return null;
  return { question: parts[0], options: parts.slice(1), votes: parts.slice(1).map(() => 0), total: 0 };
}

function createPollBox(poll) {
  const box = document.createElement('div');
  box.className = 'poll-box';
  box.id = 'active-poll';
  renderPoll(box, poll);
  messagesEl.appendChild(box);
  trimMessages(); doScroll();
  return box;
}

function renderPoll(box, poll) {
  const total = poll.total || 1;
  let html = `<div class="poll-title">📊 ${escHtml(poll.question)}</div>`;
  poll.options.forEach((opt, i) => {
    const pct = Math.round((poll.votes[i] / total) * 100) || 0;
    html += `<div class="poll-option">
      <div class="poll-option-label"><span>${escHtml(opt)}</span><span>${poll.votes[i]} votes (${pct}%)</span></div>
      <div class="poll-bar-bg"><div class="poll-bar" style="width:${pct}%;background:${POLL_COLORS[i % POLL_COLORS.length]}"></div></div>
    </div>`;
  });
  html += `<div class="poll-footer">⏱ Poll closes in <span id="poll-timer">30</span>s — chat is voting!</div>`;
  box.innerHTML = html;
}

function runPoll(poll) {
  activePoll = poll;
  const box = createPollBox(poll);
  let timeLeft = 30;

  // Announce in chat
  addSystem(`📊 POLL OPEN: ${poll.question} — chat is voting!`);

  // Fake viewers vote randomly over 30 seconds
  const voteInterval = setInterval(() => {
    if (!activePoll) { clearInterval(voteInterval); return; }
    // 1-3 votes at a time
    const numVotes = randInt(1, 3);
    for (let i = 0; i < numVotes; i++) {
      // Weight votes slightly randomly so results aren't perfectly even
      const weights = poll.options.map((_, i) => 1 + Math.random() * 2);
      const total = weights.reduce((a,b) => a+b, 0);
      let r = Math.random() * total;
      for (let j = 0; j < weights.length; j++) {
        r -= weights[j];
        if (r <= 0) { poll.votes[j]++; poll.total++; break; }
      }
    }
    // Occasionally a viewer comments on the poll
    if (Math.random() < 0.3 && !isReplying) {
      const winIdx = poll.votes.indexOf(Math.max(...poll.votes));
      const reactions = [
        `${poll.options[winIdx]} all day`,
        `easy ${poll.options[winIdx]}`,
        `${poll.options[0]} vs ${poll.options[1]} is not even close lol`,
        `chat has spoken 😂`,
        `W poll`,
        `controversial one 👀`,
      ];
      addMsg(rand(users), rand(reactions), false);
    }
    renderPoll(box, poll);
  }, 1000);

  // Countdown timer
  const timerInterval = setInterval(() => {
    timeLeft--;
    const timerEl = document.getElementById('poll-timer');
    if (timerEl) timerEl.textContent = timeLeft;
    if (timeLeft <= 0) clearInterval(timerInterval);
  }, 1000);

  // Close poll after 30s
  setTimeout(() => {
    clearInterval(voteInterval);
    clearInterval(timerInterval);
    activePoll = null;

    // Find winner
    const winIdx = poll.votes.indexOf(Math.max(...poll.votes));
    const winner = poll.options[winIdx];
    const winPct = Math.round((poll.votes[winIdx] / poll.total) * 100);

    // Update box with results
    let html = `<div class="poll-title">📊 ${escHtml(poll.question)} — CLOSED</div>`;
    poll.options.forEach((opt, i) => {
      const pct = Math.round((poll.votes[i] / poll.total) * 100) || 0;
      html += `<div class="poll-option">
        <div class="poll-option-label"><span>${i === winIdx ? '👑 ' : ''}${escHtml(opt)}</span><span>${poll.votes[i]} (${pct}%)</span></div>
        <div class="poll-bar-bg"><div class="poll-bar" style="width:${pct}%;background:${POLL_COLORS[i % POLL_COLORS.length]}"></div></div>
      </div>`;
    });
    html += `<div class="poll-winner">👑 ${escHtml(winner)} wins with ${winPct}%!</div>`;
    box.innerHTML = html;

    // Chat reacts to winner
    addSystem(`👑 Poll result: ${winner} wins!`);
    setTimeout(() => { if(!isReplying) addMsg(rand(users), `${winner} W no cap 🔥`); }, 500);
    setTimeout(() => { if(!isReplying) addMsg(rand(users), `chat chose ${winner} lets gooo`); }, 1200);
    setTimeout(() => { if(!isReplying) addMsg(rand(users), `${winner} diff 😂`); }, 2200);
    doScroll();
  }, 30000);
}

function sendUserMsg() {
  const val = inputEl.value.trim();
  if (!val) return;

  // Check for !poll command
  if (val.toLowerCase().startsWith('!poll')) {
    inputEl.value = '';
    const poll = parsePoll(val);
    if (!poll) {
      addSystem('Usage: !poll Question | Option1 | Option2 | Option3');
      return;
    }
    if (activePoll) {
      addSystem('A poll is already running!');
      return;
    }
    runPoll(poll);
    return;
  }

  if (isReplying) return;
  addMsg({ name:STREAMER, color:'#ff9955', badge:'you' }, val, true);
  inputEl.value = '';
  triggerAIReplies(val);
}

inputEl.addEventListener('keydown', e => { if (e.key==='Enter') sendUserMsg(); });

// -- VOICE (BroadcastChannel) --
try {
  const vc = new BroadcastChannel('cd_voice_channel');
  vc.onmessage = function(e) {
    try {
      const { text, showText } = e.data;
      if (!text || !text.trim()) return;
      if (showText) addMsg({ name:STREAMER, color:'#ff9955', badge:'you' }, text.trim(), true);
      isReplying = false;
      inputEl.disabled = false;
      sendBtn.disabled = false;
      triggerAIReplies(text.trim());
    } catch(err) {}
  };
} catch(e) {}

// -- GAME EVENT LISTENER (BroadcastChannel + localStorage fallback) --
try {
  const eventChannel = new BroadcastChannel('cd_event_channel');
  eventChannel.onmessage = function(e) {
    try { handleGameEvent(e.data.type, e.data.n); } catch(err) {}
  };
} catch(e) {}

// Clear any stale events from previous sessions
localStorage.removeItem('cd_event');
let lastEventTs = Date.now();
window.addEventListener('storage', function(e) {
  if (e.key === 'cd_event' && e.newValue) {
    try {
      const { type, n, ts } = JSON.parse(e.newValue);
      if (ts === lastEventTs) return;
      lastEventTs = ts;
      handleGameEvent(type, n);
    } catch(err) {}
  }
});

// Poll localStorage every 500ms as extra fallback
setInterval(function() {
  try {
    const raw = localStorage.getItem('cd_event');
    if (!raw) return;
    const { type, n, ts } = JSON.parse(raw);
    if (!ts || ts === lastEventTs) return;
    lastEventTs = ts;
    handleGameEvent(type, n);
  } catch(e) {}
}, 500);

// -- RANDOM CHAT EVENTS --
function spawnRandomMsg() {
  const u = rand(users);
  let text = rand(chatLines);
  if (Math.random() < 0.18) text += ' ' + rand(emotes);
  addMsg(u, text, u.badge==='mod'||u.badge==='vip');
}

// -- SUB COUNT PERSISTENCE (carries over between chats) --
let subCount = parseInt(localStorage.getItem('nest_sub_count') || '0');
let lastSubTs = parseInt(localStorage.getItem('nest_sub_ts') || '0');

// Sync to facecam and subalert on load with current count
try {
  const bc = new BroadcastChannel('nest_subs');
  bc.postMessage({ type:'sub', count:subCount, username:localStorage.getItem('nest_last_sub') || '' });
  bc.close();
} catch(e) {}

// Listen for subs from other chats (e.g. Nest chat) and update count
setInterval(function() {
  try {
    const raw = localStorage.getItem('nest_sub_event');
    if (!raw) return;
    const d = JSON.parse(raw);
    if (!d.ts || d.ts === lastSubTs) return;
    lastSubTs = d.ts;
    subCount = d.count;
  } catch(e) {}
}, 500);

function playRattle() {
  try {
    const audio = new Audio(RATTLE_AUDIO);
    audio.volume = 0.7;
    audio.play();
  } catch(e) {}
}

function speakSub(name) {
  try {
    const msg = new SpeechSynthesisUtterance(name + ' just subscribed! Welcome!');
    msg.rate = 0.95;
    msg.pitch = 1;
    msg.volume = 0.9;
    window.speechSynthesis.speak(msg);
  } catch(e) {}
}

function spawnSub() {
  const name = rand(subNames);
  const months = Math.random() < 0.3 ? ` (${randInt(2,24)} months!)` : '';
  // Play rattle sound
  playRattle();
  addAlert(`🎉 ${name} just subscribed!${months} Welcome to the desert! 🔥`, 'alert-sub');
  // TTS reads out the name after a short delay
  setTimeout(() => speakSub(name), 500);
  setTimeout(()=>{ if(!isReplying) addMsg(rand(users), `welcome ${name}! 🎉`); }, randInt(800,1800));
  setTimeout(()=>{ if(!isReplying) addMsg(rand(users), 'POG new sub!!'); }, randInt(1500,3000));
}

function spawnGifted() {

}

function spawnBan() {
  const inc = rand(incidents);
  const rudeDiv = addMsg({ name:inc.name, color:inc.color, badge:null }, inc.msg);
  const strikeDelay = randInt(1500, 3500);
  setTimeout(() => {
    rudeDiv.style.transition = 'opacity 0.4s';
    rudeDiv.style.opacity = '0.3';
    rudeDiv.style.textDecoration = 'line-through';
    const tag = document.createElement('span');
    tag.textContent = ' [deleted]';
    tag.style.cssText = 'font-size:10px;color:rgba(255,80,80,0.5);font-style:italic;';
    rudeDiv.appendChild(tag);
  }, strikeDelay);
  setTimeout(() => { addAlert(`🔨 ${inc.name} permanently banned — ${inc.reason}`, 'alert-ban'); }, strikeDelay + randInt(800,1500));
  const isLink = inc.reason === 'posting links' || inc.reason === 'self promotion';
  const isBanEvade = inc.reason === 'ban evasion';
  const modReacts = isLink ? ['no links in chat','link posting = instant ban','read the rules — no links'] : isBanEvade ? ['ban evasion detected','back again are we 🙄','and banned again lol'] : ['zero tolerance for that','keep it civil folks','community guidelines exist for a reason'];
  const chatReacts = isLink ? ['mods on point 🔥','link spammer cooked','they never learn lol'] : isBanEvade ? ['ban evader caught lmaoo 😂','they really thought they snuck back in'] : ['bro got cooked 💀','deserved honestly','mods ate that one'];
  if (modUsers.length) setTimeout(() => { addMsg(rand(modUsers), rand(modReacts)); }, strikeDelay + randInt(1000,2000));
  setTimeout(() => { if(!isReplying) addMsg(rand(users), rand(chatReacts)); }, strikeDelay + randInt(1800,3000));
  if (Math.random() < 0.5) setTimeout(() => { if(!isReplying) addMsg(rand(users), rand(['mods on point today','W mods','nest protection active 🔥'])); }, strikeDelay + randInt(2500,4000));
}

function scheduleRandomEvent() {
  const events = [
    { fn:spawnSub,     w:12 },{ fn:spawnGifted, w:12 },
    { fn:spawnBan,     w:25 },{ fn:spawnTimeout,w:25 },
    { fn:spawnBits,    w:18 },
  ];
  const total = events.reduce((s,e)=>s+e.w,0);
  let r = Math.random()*total;
  for (const e of events) { r-=e.w; if(r<=0){ e.fn(); break; } }
  setTimeout(scheduleRandomEvent, randInt(30000,60000));
}
