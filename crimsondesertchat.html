<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crimson Desert Live Chat</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; font-family:'Segoe UI',Arial,sans-serif; overflow:hidden; width:340px; height:100vh; }

  /* API KEY OVERLAY */
  #api-overlay {
    position:fixed; inset:0; background:rgba(8,4,2,0.97);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:9999; gap:14px; padding:30px;
  }
  #api-overlay h2 { font-size:16px; color:#ffcca0; letter-spacing:2px; text-transform:uppercase; }
  #api-overlay p  { font-size:11px; color:rgba(255,180,100,0.5); text-align:center; }
  #api-key-input {
    width:100%; max-width:300px; background:rgba(255,255,255,0.07);
    border:1px solid rgba(180,60,20,0.5); border-radius:4px;
    padding:10px 14px; font-size:13px; color:#fff; outline:none;
  }
  #api-key-btn {
    width:100%; max-width:300px; background:rgba(160,50,10,0.8);
    border:1px solid rgba(220,80,20,0.5); color:#ffcca0;
    border-radius:4px; padding:9px; font-size:13px; font-weight:700; cursor:pointer;
  }
  #api-key-err { font-size:11px; color:#ff6666; display:none; }
  #api-note    { font-size:10px; color:rgba(255,180,100,0.3); text-align:center; max-width:280px; }

  /* CHAT */
  #chat-wrapper {
    width:340px; height:100vh; display:flex; flex-direction:column;
    background:rgba(8,4,2,0.82); border-left:2px solid rgba(180,60,20,0.7);
    backdrop-filter:blur(4px); position:relative;
  }
  #chat-header {
    padding:10px 14px; background:rgba(140,40,10,0.85);
    border-bottom:1px solid rgba(220,80,20,0.5);
    display:flex; align-items:center; gap:8px; flex-shrink:0;
  }
  .live-dot { width:8px; height:8px; border-radius:50%; background:#ff4422; animation:pulse 1.2s infinite; flex-shrink:0; }
  @keyframes pulse {
    0%,100%{ opacity:1; box-shadow:0 0 0 0 rgba(255,60,20,0.5); }
    50%    { opacity:0.7; box-shadow:0 0 0 4px rgba(255,60,20,0); }
  }
  #chat-header span { font-size:13px; font-weight:700; color:#ffcca0; letter-spacing:0.5px; text-transform:uppercase; }
  #viewer-count { margin-left:auto; font-size:12px; color:rgba(255,180,130,0.8); display:flex; align-items:center; gap:4px; }

  #messages { flex:1; overflow-y:auto; padding:8px 6px; display:flex; flex-direction:column; gap:2px; scroll-behavior:smooth; }
  #messages::-webkit-scrollbar { width:3px; }
  #messages::-webkit-scrollbar-thumb { background:rgba(180,60,20,0.4); border-radius:2px; }

  .msg { display:flex; align-items:baseline; gap:5px; padding:3px 6px; border-radius:3px; animation:fadeIn 0.25s ease; line-height:1.4; flex-wrap:wrap; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .msg:hover { background:rgba(255,255,255,0.04); }

  .badge { font-size:10px; padding:1px 5px; border-radius:2px; font-weight:700; flex-shrink:0; letter-spacing:0.3px; }
  .badge-mod { background:rgba(0,180,80,0.25);   color:#44ff88; border:1px solid rgba(0,180,80,0.3); }
  .badge-sub { background:rgba(140,60,220,0.25); color:#cc88ff; border:1px solid rgba(140,60,220,0.3); }
  .badge-vip { background:rgba(220,180,0,0.20);  color:#ffdd44; border:1px solid rgba(220,180,0,0.3); }
  .badge-you { background:rgba(255,120,30,0.30); color:#ffaa55; border:1px solid rgba(255,120,30,0.4); }

  .username { font-size:13px; font-weight:700; flex-shrink:0; cursor:default; }
  .colon    { font-size:13px; color:rgba(255,255,255,0.3); flex-shrink:0; }
  .text     { font-size:13px; color:rgba(255,245,235,0.9); word-break:break-word; flex:1; min-width:0; }
  .highlight  { background:rgba(255,130,30,0.12); border-left:2px solid rgba(255,150,50,0.7); }
  .reply-msg  { background:rgba(140,60,20,0.18);  border-left:2px solid rgba(220,80,20,0.6); }

  .system-msg { font-size:11px; color:rgba(255,180,100,0.6); text-align:center; padding:4px 0; font-style:italic; }
  .raid-msg   { font-size:12px; color:#ffdd44; text-align:center; padding:6px 8px; background:rgba(180,130,0,0.15); border:1px solid rgba(220,180,0,0.3); border-radius:4px; margin:4px 0; animation:fadeIn 0.4s ease; }

  .event-announce { font-size:12px; font-weight:700; text-align:center; padding:6px 8px; border-radius:4px; margin:4px 0; animation:fadeIn 0.4s ease; letter-spacing:0.3px; }
  .event-death   { background:rgba(160,20,20,0.25); border:1px solid rgba(255,50,50,0.4);   color:#ff9999; }
  .event-kill    { background:rgba(180,80,0,0.25);  border:1px solid rgba(255,140,30,0.4);  color:#ffbb66; }
  .event-mission { background:rgba(0,120,50,0.25);  border:1px solid rgba(30,220,100,0.4);  color:#66ffbb; }
  .event-boss    { background:rgba(100,0,140,0.25); border:1px solid rgba(180,60,255,0.4);  color:#cc99ff; }

  .alert-msg { font-size:12px; text-align:center; padding:6px 10px; border-radius:4px; margin:4px 0; animation:fadeIn 0.4s ease; font-weight:700; }
  .alert-sub    { background:rgba(140,60,220,0.2); border:1px solid rgba(180,80,255,0.4); color:#dd99ff; }
  .alert-gifted { background:rgba(220,140,0,0.2);  border:1px solid rgba(255,180,30,0.4); color:#ffdd77; }
  .alert-ban    { background:rgba(200,30,30,0.2);  border:1px solid rgba(255,60,60,0.35); color:#ff9999; font-style:italic; }
  .alert-timeout{ background:rgba(160,80,0,0.2);   border:1px solid rgba(220,120,0,0.35); color:#ffbb66; font-style:italic; }
  .alert-bits   { background:rgba(30,120,220,0.2); border:1px solid rgba(60,160,255,0.4); color:#88ccff; }

  .typing-indicator { display:flex; align-items:center; gap:6px; padding:4px 10px; animation:fadeIn 0.2s ease; }
  .typing-dots { display:flex; gap:3px; align-items:center; }
  .typing-dots span { width:5px; height:5px; border-radius:50%; background:rgba(255,150,80,0.6); animation:bounce 1.2s infinite; }
  .typing-dots span:nth-child(2){ animation-delay:0.2s; }
  .typing-dots span:nth-child(3){ animation-delay:0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:0.5} 40%{transform:translateY(-4px);opacity:1} }
  .typing-label { font-size:11px; color:rgba(255,180,100,0.55); font-style:italic; }

  #scroll-btn {
    position:absolute; bottom:58px; right:12px; background:rgba(160,50,10,0.95);
    color:#ffcca0; border:1px solid rgba(220,80,20,0.5); border-radius:12px;
    padding:4px 12px; font-size:11px; cursor:pointer; font-family:inherit; font-weight:600; display:none; z-index:10;
  }
  #chat-input-area { padding:8px 10px; background:rgba(20,8,3,0.9); border-top:1px solid rgba(180,60,20,0.3); display:flex; gap:6px; flex-shrink:0; }
  #chat-input { flex:1; background:rgba(255,255,255,0.07); border:1px solid rgba(180,60,20,0.35); border-radius:4px; padding:6px 10px; font-size:12px; color:#fff; outline:none; font-family:inherit; }
  #chat-input::placeholder { color:rgba(255,180,130,0.4); }
  #chat-input:focus { border-color:rgba(220,80,20,0.7); }
  #chat-input:disabled { opacity:0.5; cursor:not-allowed; }
  #send-btn { background:rgba(160,50,10,0.8); border:1px solid rgba(220,80,20,0.5); color:#ffcca0; border-radius:4px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
  #send-btn:hover   { background:rgba(200,70,15,0.9); }
  #send-btn:disabled{ opacity:0.4; cursor:not-allowed; }
</style>
</head>
<body>

<!-- API KEY OVERLAY -->
<div id="api-overlay">
  <h2>⚔️ Crimson Desert Chat</h2>
  <p>Enter your Anthropic API key to activate AI chat responses</p>
  <input id="api-key-input" type="password" placeholder="sk-ant-..." />
  <button id="api-key-btn" onclick="saveApiKey()">Start Chat</button>
  <div id="api-key-err">Invalid key — must start with sk-ant-</div>
  <p id="api-note">Saved in this browser only — never uploaded anywhere</p>
</div>

<div id="chat-wrapper">
  <div id="chat-header">
    <div class="live-dot"></div>
    <span>&#9876; Crimson Desert</span>
    <div id="viewer-count">&#128065; <span id="vcount">1,247</span></div>
  </div>
  <div id="messages">
    <div class="system-msg">Welcome to the stream! Type below to chat 🔥</div>
  </div>
  <button id="scroll-btn" onclick="scrollToBottom()">&#8595; New messages</button>
  <div id="chat-input-area">
    <input id="chat-input" type="text" placeholder="Send a message..." maxlength="200" />
    <button id="send-btn" onclick="sendUserMsg()">Chat</button>
  </div>
</div>

<script>
// ── API KEY ──
function getApiKey() { return localStorage.getItem('cd_api_key') || ''; }

function saveApiKey() {
  const val = document.getElementById('api-key-input').value.trim();
  if (!val.startsWith('sk-ant-')) { document.getElementById('api-key-err').style.display='block'; return; }
  localStorage.setItem('cd_api_key', val);
  document.getElementById('api-overlay').style.display = 'none';
}

document.getElementById('api-key-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') saveApiKey(); });

// Hide overlay if key already saved
if (getApiKey()) document.getElementById('api-overlay').style.display = 'none';

// ── SETUP ──
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('chat-input');
const scrollBtn  = document.getElementById('scroll-btn');
const sendBtn    = document.getElementById('send-btn');
const vcountEl   = document.getElementById('vcount');

let autoScroll  = true;
let viewerCount = 1247;
let isReplying  = false;
const stats     = { death:0, kill:0, mission:0, boss:0 };
const STREAMER  = 'Streamer';

const users = [
  { name:'SandWraith_',     color:'#ff8855', badge:null  },
  { name:'CrimsonBlade99',  color:'#ff4466', badge:'sub' },
  { name:'DesertPhoenix',   color:'#ffaa33', badge:null  },
  { name:'VoidWalkerX',     color:'#aa88ff', badge:'sub' },
  { name:'NightHunterGG',   color:'#44ccff', badge:null  },
  { name:'BloodMoonRaider', color:'#ff6644', badge:'mod' },
  { name:'SilverStorm77',   color:'#ccddff', badge:null  },
  { name:'DragonSoul_',     color:'#ff3355', badge:'vip' },
  { name:'EchoOfAshes',     color:'#ffcc66', badge:'sub' },
  { name:'IronVeil_',       color:'#88ffcc', badge:null  },
  { name:'StarlightAce',    color:'#ffaaee', badge:'sub' },
  { name:'ThunderRex',      color:'#ff7733', badge:null  },
  { name:'ObsidianKnight',  color:'#bb99ff', badge:'mod' },
  { name:'CrimsonEcho_',    color:'#ff5533', badge:null  },
  { name:'ArcaneWolf',      color:'#55ddff', badge:'sub' },
  { name:'DawnBreaker_',    color:'#ffdd55', badge:null  },
  { name:'ShadowFang99',    color:'#ff88aa', badge:null  },
  { name:'StormCaller_',    color:'#88ccff', badge:'vip' },
  { name:'EmberKnight_',    color:'#ff9944', badge:null  },
  { name:'RuneSeeker',      color:'#99eeff', badge:'sub' },
  { name:'GrimReaper_GG',   color:'#dd77ff', badge:null  },
  { name:'CinderWraith',    color:'#ff6622', badge:'sub' },
  { name:'ScarletHunter',   color:'#ff4455', badge:'vip' },
];

const chatLines = [
  'LETS GOOOOO 🔥🔥🔥','this game looks insane','graphics are unreal omg',
  'bro that combo was clean af','first time watching, this is sick',
  'W streamer W streamer','this is the best game this year no cap',
  'HYPE HYPE HYPE','that boss fight was NUTS','clip that!!','LFG!!!!! 🔥',
  'never seen combat this fluid','subbed, this is too good','gg ez',
  'the lore in this game is so deep','KEKW','the desert biome looks gorgeous',
  'rip inventory management 😂','game of the year contender fr',
  'the world building is incredible','that mounted combat is so smooth',
  'the character design is top tier','what class are you running?',
  'finally a game worth watching','this is giving me Elden Ring vibes but better',
  'that parry timing was CLEAN','POG POG POG','the skill tree looks insane',
  'that dodge animation is smooth af','OMEGALUL','this combat is chef kiss 🤌',
  'we eating good with this game fr',
];

const emotes    = ['🔥','💀','⚔️','🛡️','👑','🏆','💥','✨','😂','🤌','👀','🎮'];
const gifters   = ['CrimsonBlade99','DragonSoul_','StormCaller_','ObsidianKnight','VoidWalkerX'];
const subNames  = ['AzureDawn_','RedSandX','MirrorBlade','ChaosRunner','NeonWarden'];
const rudeNames = ['ToxicTroll77','SpamBot_9000','RudeViewer_','AngrySalad_','MadLad_420'];
const rudeMsgs  = [
  'this streamer is absolute crap lmao','what an arsehole move wtf',
  'bro you\'re dogsh*t at this game lol','holy crap what was that you muppet',
  'this is garbage content get off stream','what a tosser seriously',
  'playing like a complete numpty lmaooo',
];
const banReasons   = ['spamming','being toxic','posting links','ban evasion','self-promotion'];
const timeoutNames = ['LoudMouth_','BackseatGamer99','SpamKing_','NoisyViewer','ChatSpammer'];
const timeoutLens  = ['60s','5 mins','10 mins','30 mins'];
const bitAmounts   = [100,200,500,1000,5000];
const bitMsgs      = ['lets go! 🔥','keep it up!','W stream','for the hype!','LETS GOOOOO'];
const giftCounts   = [1,1,1,2,3,5,10];
const modUsers     = users.filter(u => u.badge === 'mod');

const eventConfig = {
  death:   { cls:'event-death',   label:n=>`💀 STREAMER DIED — Death #${n}`,         prompt:n=>`Twitch viewer watching Crimson Desert. Streamer died for the ${n}th time. Short funny/savage reaction under 15 words, max 1 emoji. Never mention AI.` },
  kill:    { cls:'event-kill',    label:n=>`⚔️ KILL! — ${n} kills this session`,      prompt:n=>`Twitch viewer watching Crimson Desert. Streamer got kill #${n}. Short hype reaction under 15 words, max 1 emoji. Never mention AI.` },
  mission: { cls:'event-mission', label:n=>`✅ MISSION COMPLETE — #${n} this stream`, prompt:n=>`Twitch viewer watching Crimson Desert. Streamer completed mission #${n}. Short hyped reaction under 15 words, max 1 emoji. Never mention AI.` },
  boss:    { cls:'event-boss',    label:n=>`👑 BOSS DEFEATED — #${n} down!`,          prompt:n=>`Twitch viewer watching Crimson Desert. Streamer defeated boss #${n}. Extremely hyped reaction under 15 words, max 1 emoji. Never mention AI.` },
};

function rand(a)         { return a[Math.floor(Math.random()*a.length)]; }
function randInt(a,b)    { return Math.floor(Math.random()*(b-a+1))+a; }
function escHtml(s)      { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function addMsg(user, text, highlight, extra) {
  const d = document.createElement('div');
  d.className = 'msg' + (highlight?' highlight':'') + (extra?' '+extra:'');
  let h = '';
  if (user.badge==='mod') h += '<span class="badge badge-mod">MOD</span>';
  else if (user.badge==='sub') h += '<span class="badge badge-sub">SUB</span>';
  else if (user.badge==='vip') h += '<span class="badge badge-vip">VIP</span>';
  else if (user.badge==='you') h += '<span class="badge badge-you">YOU</span>';
  h += `<span class="username" style="color:${user.color}">${escHtml(user.name)}</span>`;
  h += '<span class="colon">:</span>';
  h += `<span class="text">${escHtml(text)}</span>`;
  d.innerHTML = h;
  messagesEl.appendChild(d);
  trimMessages(); doScroll();
  return d;
}

function addSystem(text, raid) {
  const d = document.createElement('div');
  d.className = raid ? 'raid-msg' : 'system-msg';
  d.textContent = text;
  messagesEl.appendChild(d); trimMessages(); doScroll();
}

function addAlert(text, cls) {
  const d = document.createElement('div');
  d.className = 'alert-msg ' + cls;
  d.textContent = text;
  messagesEl.appendChild(d); trimMessages(); doScroll();
}

function addEventAnnounce(text, cls) {
  const d = document.createElement('div');
  d.className = 'event-announce ' + cls;
  d.textContent = text;
  messagesEl.appendChild(d); trimMessages(); doScroll();
}

function showTyping(name, color) {
  const d = document.createElement('div');
  d.className = 'typing-indicator';
  d.innerHTML = `<span style="font-size:12px;font-weight:700;color:${color}">${escHtml(name)}</span><div class="typing-dots"><span></span><span></span><span></span></div><span class="typing-label">typing...</span>`;
  messagesEl.appendChild(d); doScroll();
  return d;
}

function removeTyping(d) { if (d && d.parentNode) d.parentNode.removeChild(d); }
function trimMessages()  { while (messagesEl.children.length > 250) messagesEl.removeChild(messagesEl.children[0]); }
function doScroll()      { if (autoScroll) messagesEl.scrollTop = messagesEl.scrollHeight; else scrollBtn.style.display='block'; }
function scrollToBottom(){ autoScroll=true; messagesEl.scrollTop=messagesEl.scrollHeight; scrollBtn.style.display='none'; }

messagesEl.addEventListener('scroll', function() {
  const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 50;
  if (atBottom) { autoScroll=true; scrollBtn.style.display='none'; } else autoScroll=false;
});

// ── AI CALL ──
async function callAI(system, userMsg) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': getApiKey(),
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-inaccessible': ''
    },
    body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:60, system, messages:[{role:'user',content:userMsg}] })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || 'API error');
  return data.content?.[0]?.text?.trim().replace(/^["']|["']$/g,'') || rand(chatLines);
}

// ── AI REPLIES ──
async function triggerAIReplies(streamerMsg) {
  isReplying = true;
  inputEl.disabled = true;
  sendBtn.disabled = true;

  const system = `You are a Twitch chat viewer watching a Crimson Desert gameplay stream. The streamer just said something. Reply authentically. Rules: under 15 words, casual Twitch tone, max 1 emoji, no hashtags, react directly to what they said. Never mention being an AI.`;
  const shuffled = [...users].sort(()=>Math.random()-0.5).slice(0, randInt(2,4));

  for (let i = 0; i < shuffled.length; i++) {
    const u = shuffled[i];
    await new Promise(r => setTimeout(r, randInt(800,2200)*(i+1)));
    const t = showTyping(u.name, u.color);
    await new Promise(r => setTimeout(r, randInt(1200,2500)));
    removeTyping(t);
    try {
      const reply = await callAI(system, `Streamer said: "${streamerMsg}". Reply as viewer ${u.name}:`);
      addMsg(u, reply, false, 'reply-msg');
    } catch(e) { addMsg(u, rand(chatLines), false, 'reply-msg'); }
  }

  isReplying = false;
  inputEl.disabled = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

// ── GAME EVENTS ──
async function handleGameEvent(type, n) {
  const cfg = eventConfig[type];
  if (!cfg) return;
  addEventAnnounce(cfg.label(n), cfg.cls);

  const shuffled = [...users].sort(()=>Math.random()-0.5).slice(0, randInt(3,5));
  for (let i = 0; i < shuffled.length; i++) {
    const u = shuffled[i];
    await new Promise(r => setTimeout(r, randInt(400,1100)*(i+1)));
    const t = showTyping(u.name, u.color);
    await new Promise(r => setTimeout(r, randInt(900,2000)));
    removeTyping(t);
    try {
      const reply = await callAI(cfg.prompt(n), `React as viewer ${u.name}:`);
      addMsg(u, reply, false, 'reply-msg');
    } catch(e) { addMsg(u, rand(chatLines), false, 'reply-msg'); }
  }
}

// ── SEND MESSAGE ──
function sendUserMsg() {
  const val = inputEl.value.trim();
  if (!val || isReplying) return;
  addMsg({ name:STREAMER, color:'#ff9955', badge:'you' }, val, true);
  inputEl.value = '';
  triggerAIReplies(val);
}

inputEl.addEventListener('keydown', e => { if (e.key==='Enter') sendUserMsg(); });

// ── VOICE (BroadcastChannel) ──
try {
  const vc = new BroadcastChannel('cd_voice_channel');
  vc.onmessage = function(e) {
    try {
      const { text, showText } = e.data;
      if (!text || !text.trim()) return;
      if (showText) addMsg({ name:STREAMER, color:'#ff9955', badge:'you' }, text.trim(), true);
      isReplying = false;
      inputEl.disabled = false;
      sendBtn.disabled = false;
      triggerAIReplies(text.trim());
    } catch(err) {}
  };
} catch(e) {}

// ── GAME EVENT LISTENER ──
window.addEventListener('storage', function(e) {
  if (e.key === 'cd_event' && e.newValue) {
    try {
      const { type, n } = JSON.parse(e.newValue);
      handleGameEvent(type, n);
    } catch(err) {}
  }
});

// ── RANDOM CHAT EVENTS ──
function spawnRandomMsg() {
  const u = rand(users);
  let text = rand(chatLines);
  if (Math.random() < 0.18) text += ' ' + rand(emotes);
  addMsg(u, text, u.badge==='mod'||u.badge==='vip');
}

function spawnSub() {
  const name = rand(subNames);
  const months = Math.random() < 0.3 ? ` (${randInt(2,24)} months!)` : '';
  addAlert(`🎉 ${name} just subscribed!${months} Welcome to the desert! 🔥`, 'alert-sub');
  setTimeout(()=>{ if(!isReplying) addMsg(rand(users), `welcome ${name}! 🎉`); }, randInt(800,1800));
  setTimeout(()=>{ if(!isReplying) addMsg(rand(users), 'POG new sub!!'); }, randInt(1500,3000));
}

function spawnGifted() {
  const gifter = rand(gifters);
  const count  = rand(giftCounts);
  addAlert(`🎁 ${gifter} gifted ${count} sub${count>1?'s':''} to the community! Legend! 👑`, 'alert-gifted');
  const hypes = ['PogChamp gifted subs!!','W gifter W','lets gooo 🎁','king behaviour fr','OMFG gifted subs!!!'];
  for (let i = 0; i < Math.min(count+1,4); i++) {
    setTimeout(()=>{ if(!isReplying) addMsg(rand(users), rand(hypes)); }, randInt(600,1200)*(i+1));
  }
}

function spawnBan() {
  const name    = rand(rudeNames);
  const rudeMsg = rand(rudeMsgs);
  const rudeDiv = addMsg({ name, color:'#ff6666', badge:null }, rudeMsg);
  setTimeout(()=>{
    rudeDiv.style.transition = 'opacity 0.4s';
    rudeDiv.style.opacity = '0.3';
    rudeDiv.style.textDecoration = 'line-through';
    const tag = document.createElement('span');
    tag.textContent = ' [deleted]';
    tag.style.cssText = 'font-size:10px;color:rgba(255,80,80,0.5);font-style:italic;';
    rudeDiv.appendChild(tag);
  }, randInt(1500,3000));
  setTimeout(()=>{ addAlert(`🔨 ${name} was banned — ${rand(banReasons)}`, 'alert-ban'); }, randInt(2500,4500));
  setTimeout(()=>{ if(!isReplying) addMsg(rand(users), 'bro got cooked 💀'); }, randInt(3000,5000));
  if (modUsers.length) setTimeout(()=>{ if(!isReplying) addMsg(rand(modUsers), rand(['keep it civil folks','zero tolerance for that','warned you 🔨'])); }, randInt(2800,4200));
}

function spawnTimeout() {
  const name    = rand(timeoutNames);
  const rudeMsg = rand(rudeMsgs);
  const rudeDiv = addMsg({ name, color:'#ffaa66', badge:null }, rudeMsg);
  setTimeout(()=>{
    rudeDiv.style.transition = 'opacity 0.4s';
    rudeDiv.style.opacity = '0.3';
    rudeDiv.style.textDecoration = 'line-through';
    const tag = document.createElement('span');
    tag.textContent = ' [deleted]';
    tag.style.cssText = 'font-size:10px;color:rgba(255,150,50,0.5);font-style:italic;';
    rudeDiv.appendChild(tag);
  }, randInt(1200,2500));
  setTimeout(()=>{ addAlert(`⏱ ${name} was timed out for ${rand(timeoutLens)}`, 'alert-timeout'); }, randInt(2200,3800));
  setTimeout(()=>{ if(!isReplying) addMsg(rand(users), 'they deserved that lol'); }, randInt(2800,4200));
  if (modUsers.length) setTimeout(()=>{ if(!isReplying) addMsg(rand(modUsers), rand(['read the rules','calm it down','cool off time 👍'])); }, randInt(2500,3800));
}

function spawnBits() {
  const name = rand(users).name;
  const amt  = rand(bitAmounts);
  addAlert(`💎 ${name} cheered ${amt.toLocaleString()} bits — "${rand(bitMsgs)}"`, 'alert-bits');
  setTimeout(()=>{ if(!isReplying) addMsg(rand(users), `${amt>=1000?'HOLY':'nice'} bits ${name}! 💎`); }, randInt(600,1400));
}

function spawnRaid() {
  const count = rand([82,115,47,230,64,310,88]);
  const ch    = rand(['DesertLegion_TV','BladeStormLive','NightReign_','VoidCaster99','SandStorm_Live']);
  addSystem(`⚔️ RAID! ${ch} is raiding with ${count} viewers! ⚔️`, true);
  setTimeout(()=>{ if(!isReplying) addMsg(rand(users), 'welcome raiders!! 🔥'); }, randInt(600,1200));
  setTimeout(()=>{ if(!isReplying) addMsg(rand(users), `${ch} squad lets gooo`); }, randInt(1400,2400));
}

function updateViewers() {
  viewerCount += randInt(-12,18);
  if (viewerCount < 800) viewerCount = 800;
  vcountEl.textContent = viewerCount.toLocaleString();
}

function scheduleNext() {
  setTimeout(function(){ if(!isReplying) spawnRandomMsg(); scheduleNext(); }, randInt(400,2600));
}

function scheduleRandomEvent() {
  const events = [
    { fn:spawnSub,     w:30 },{ fn:spawnGifted, w:12 },
    { fn:spawnBan,     w:25 },{ fn:spawnTimeout,w:25 },
    { fn:spawnBits,    w:18 },
  ];
  const total = events.reduce((s,e)=>s+e.w,0);
  let r = Math.random()*total;
  for (const e of events) { r-=e.w; if(r<=0){ e.fn(); break; } }
  setTimeout(scheduleRandomEvent, randInt(20000,35000));
}

scheduleNext();
setInterval(updateViewers, 5000);
setTimeout(spawnRaid, 45000);
setInterval(spawnRaid, 120000);
setTimeout(scheduleRandomEvent, randInt(8000,12000));

addMsg(rand(users), 'FIRST!! 🔥');
setTimeout(()=>{ addMsg(rand(users),'lets gooo crimson desert HYPE!!'); }, 700);
setTimeout(()=>{ addMsg(rand(users),'chat moving fast already lol'); }, 1600);
setTimeout(()=>{ addMsg(rand(users),'W game W streamer 👑'); }, 2700);
setTimeout(()=>{ addSystem('💬 Type a message below — chat will reply to you!'); }, 3500);
</script>
