<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crimson Desert Live Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    width: 340px;
    height: 100vh;
  }

  #chat-wrapper {
    width: 340px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: rgba(8, 4, 2, 0.82);
    border-left: 2px solid rgba(180, 60, 20, 0.7);
    backdrop-filter: blur(4px);
    position: relative;
  }

  #chat-header {
    padding: 10px 14px;
    background: rgba(140, 40, 10, 0.85);
    border-bottom: 1px solid rgba(220, 80, 20, 0.5);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ff4422;
    animation: pulse 1.2s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(255,60,20,0.5); }
    50%      { opacity:0.7; box-shadow: 0 0 0 4px rgba(255,60,20,0); }
  }

  #chat-header span {
    font-size: 13px; font-weight: 700;
    color: #ffcca0; letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  #viewer-count {
    margin-left: auto; font-size: 12px;
    color: rgba(255,180,130,0.8);
    display: flex; align-items: center; gap: 4px;
  }

  #messages {
    flex: 1; overflow-y: auto;
    padding: 8px 6px;
    display: flex; flex-direction: column; gap: 2px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 3px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: rgba(180,60,20,0.4); border-radius: 2px; }

  .msg {
    display: flex; align-items: baseline; gap: 5px;
    padding: 3px 6px; border-radius: 3px;
    animation: fadeIn 0.25s ease;
    line-height: 1.4; flex-wrap: wrap;
  }

  @keyframes fadeIn {
    from { opacity:0; transform:translateY(6px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .msg:hover { background: rgba(255,255,255,0.04); }

  .badge {
    font-size: 10px; padding: 1px 5px; border-radius: 2px;
    font-weight: 700; flex-shrink: 0; letter-spacing: 0.3px;
  }

  .badge-mod { background:rgba(0,180,80,0.25);   color:#44ff88; border:1px solid rgba(0,180,80,0.3); }
  .badge-sub { background:rgba(140,60,220,0.25); color:#cc88ff; border:1px solid rgba(140,60,220,0.3); }
  .badge-vip { background:rgba(220,180,0,0.20);  color:#ffdd44; border:1px solid rgba(220,180,0,0.3); }
  .badge-you { background:rgba(255,120,30,0.30); color:#ffaa55; border:1px solid rgba(255,120,30,0.4); }

  .username { font-size:13px; font-weight:700; flex-shrink:0; cursor:default; }
  .colon    { font-size:13px; color:rgba(255,255,255,0.3); flex-shrink:0; }
  .text     { font-size:13px; color:rgba(255,245,235,0.9); word-break:break-word; flex:1; min-width:0; }

  .highlight {
    background: rgba(255,130,30,0.12);
    border-left: 2px solid rgba(255,150,50,0.7);
  }

  .reply-msg {
    background: rgba(140,60,20,0.18);
    border-left: 2px solid rgba(220,80,20,0.6);
  }

  .system-msg {
    font-size:11px; color:rgba(255,180,100,0.6);
    text-align:center; padding:4px 0; font-style:italic;
  }

  .raid-msg {
    font-size:12px; color:#ffdd44; text-align:center;
    padding:6px 8px;
    background:rgba(180,130,0,0.15);
    border:1px solid rgba(220,180,0,0.3);
    border-radius:4px; margin:4px 0;
    animation: fadeIn 0.4s ease;
  }

  .event-announce {
    font-size: 12px; font-weight: 700;
    text-align: center; padding: 6px 8px;
    border-radius: 4px; margin: 4px 0;
    animation: fadeIn 0.4s ease;
    letter-spacing: 0.3px;
  }

  .event-death   { background:rgba(160,20,20,0.25); border:1px solid rgba(255,50,50,0.4);   color:#ff9999; }
  .event-kill    { background:rgba(180,80,0,0.25);  border:1px solid rgba(255,140,30,0.4);  color:#ffbb66; }
  .event-mission { background:rgba(0,120,50,0.25);  border:1px solid rgba(30,220,100,0.4);  color:#66ffbb; }
  .event-boss    { background:rgba(100,0,140,0.25); border:1px solid rgba(180,60,255,0.4);  color:#cc99ff; }

  .typing-indicator {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; animation: fadeIn 0.2s ease;
  }

  .typing-dots { display: flex; gap: 3px; align-items: center; }

  .typing-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(255,150,80,0.6);
    animation: bounce 1.2s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%,80%,100% { transform:translateY(0); opacity:0.5; }
    40%          { transform:translateY(-4px); opacity:1; }
  }

  .typing-label { font-size:11px; color:rgba(255,180,100,0.55); font-style:italic; }

  #scroll-btn {
    position: absolute; bottom: 58px; right: 12px;
    background: rgba(160,50,10,0.95);
    color: #ffcca0;
    border: 1px solid rgba(220,80,20,0.5);
    border-radius: 12px;
    padding: 4px 12px; font-size:11px;
    cursor:pointer; font-family:inherit; font-weight:600;
    display:none; z-index:10;
  }

  #chat-input-area {
    padding: 8px 10px;
    background: rgba(20,8,3,0.9);
    border-top: 1px solid rgba(180,60,20,0.3);
    display: flex; gap:6px; flex-shrink:0;
  }

  #chat-input {
    flex:1;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(180,60,20,0.35);
    border-radius:4px; padding:6px 10px;
    font-size:12px; color:#fff; outline:none;
    font-family:inherit;
  }

  #chat-input::placeholder { color:rgba(255,180,130,0.4); }
  #chat-input:focus { border-color:rgba(220,80,20,0.7); background:rgba(255,255,255,0.1); }
  #chat-input:disabled { opacity:0.5; cursor:not-allowed; }

  #send-btn {
    background: rgba(160,50,10,0.8);
    border:1px solid rgba(220,80,20,0.5);
    color:#ffcca0; border-radius:4px;
    padding:6px 12px; font-size:12px; font-weight:700;
    cursor:pointer; font-family:inherit; transition:background 0.15s;
  }

  #send-btn:hover  { background:rgba(200,70,15,0.9); }
  #send-btn:active { transform:scale(0.97); }
  #send-btn:disabled { opacity:0.4; cursor:not-allowed; }
</style>
</head>
<body>

<!-- API KEY OVERLAY -->
<div id="api-overlay" style="
  position:fixed;inset:0;background:rgba(8,4,2,0.97);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;gap:16px;padding:30px;font-family:'Segoe UI',sans-serif;
">
  <div style="font-size:22px;">⚔️</div>
  <div style="font-family:'Orbitron',monospace;font-size:13px;color:#ffcca0;letter-spacing:2px;text-transform:uppercase;">Crimson Desert Chat</div>
  <div style="font-size:11px;color:rgba(255,180,100,0.5);letter-spacing:1px;text-align:center;">Enter your Anthropic API key to activate AI chat</div>
  <input id="api-key-input" type="password" placeholder="sk-ant-..." style="
    width:100%;max-width:300px;background:rgba(255,255,255,0.07);
    border:1px solid rgba(180,60,20,0.5);border-radius:4px;
    padding:10px 14px;font-size:13px;color:#fff;outline:none;
    font-family:'Segoe UI',sans-serif;
  "/>
  <button onclick="saveApiKey()" style="
    background:rgba(160,50,10,0.8);border:1px solid rgba(220,80,20,0.5);
    color:#ffcca0;border-radius:4px;padding:8px 24px;font-size:13px;
    font-weight:700;cursor:pointer;width:100%;max-width:300px;
  ">Start Chat</button>
  <div id="api-error" style="font-size:11px;color:#ff6666;display:none;">Invalid key — must start with sk-ant-</div>
  <div style="font-size:10px;color:rgba(255,180,100,0.3);text-align:center;max-width:280px;">
    Your key is saved in this browser only — never uploaded anywhere
  </div>
</div>

<div id="chat-wrapper">
  <div id="chat-header">
    <div class="live-dot"></div>
    <span>&#9876; Crimson Desert</span>
    <div id="viewer-count">&#128065; <span id="vcount">1,247</span></div>
  </div>

  <div id="messages">
    <div class="system-msg">Welcome to the stream! Type below to chat 🔥</div>
  </div>

  <button id="scroll-btn" onclick="scrollToBottom()">&#8595; New messages</button>

  <div id="chat-input-area">
    <input id="chat-input" type="text" placeholder="Send a message..." maxlength="200" />
    <button id="send-btn" onclick="sendUserMsg()">Chat</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('chat-input');
const scrollBtn  = document.getElementById('scroll-btn');
const sendBtn    = document.getElementById('send-btn');
const vcountEl   = document.getElementById('vcount');

let autoScroll  = true;
let viewerCount = 1247;
let isReplying  = false;

const stats = { death: 0, kill: 0, mission: 0, boss: 0 };

const STREAMER_NAME = 'Streamer';

const users = [
  { name:'SandWraith_',     color:'#ff8855', badge:null  },
  { name:'CrimsonBlade99',  color:'#ff4466', badge:'sub' },
  { name:'DesertPhoenix',   color:'#ffaa33', badge:null  },
  { name:'VoidWalkerX',     color:'#aa88ff', badge:'sub' },
  { name:'NightHunterGG',   color:'#44ccff', badge:null  },
  { name:'BloodMoonRaider', color:'#ff6644', badge:'mod' },
  { name:'SilverStorm77',   color:'#ccddff', badge:null  },
  { name:'DragonSoul_',     color:'#ff3355', badge:'vip' },
  { name:'EchoOfAshes',     color:'#ffcc66', badge:'sub' },
  { name:'IronVeil_',       color:'#88ffcc', badge:null  },
  { name:'StarlightAce',    color:'#ffaaee', badge:'sub' },
  { name:'ThunderRex',      color:'#ff7733', badge:null  },
  { name:'ObsidianKnight',  color:'#bb99ff', badge:'mod' },
  { name:'CrimsonEcho_',    color:'#ff5533', badge:null  },
  { name:'ArcaneWolf',      color:'#55ddff', badge:'sub' },
  { name:'DawnBreaker_',    color:'#ffdd55', badge:null  },
  { name:'ShadowFang99',    color:'#ff88aa', badge:null  },
  { name:'StormCaller_',    color:'#88ccff', badge:'vip' },
  { name:'EmberKnight_',    color:'#ff9944', badge:null  },
  { name:'RuneSeeker',      color:'#99eeff', badge:'sub' },
  { name:'GrimReaper_GG',   color:'#dd77ff', badge:null  },
  { name:'CinderWraith',    color:'#ff6622', badge:'sub' },
  { name:'ScarletHunter',   color:'#ff4455', badge:'vip' },
];

const chatLines = [
  'LETS GOOOOO 🔥🔥🔥','this game looks insane',
  'can we get an F in chat for that death','graphics are unreal omg',
  'bro that combo was clean af','first time watching, this is sick',
  'W streamer W streamer','this is the best game this year no cap',
  'how are the framerates holding up?','HYPE HYPE HYPE',
  'that boss fight was NUTS','clip that!!','LFG!!!!! 🔥',
  'never seen combat this fluid','subbed, this is too good','gg ez',
  'can you show character creation again?','the lore in this game is so deep',
  'KEKW','the desert biome looks gorgeous','that sword skill combo omg',
  'rip inventory management 😂','how long have you been playing?',
  'game of the year contender fr','lets get those 2k viewers!',
  'the world building is incredible','that mounted combat is so smooth',
  'anyone else notice the day/night cycle?','the character design is top tier',
  'what class are you running?','the OST slaps hard',
  'finally a game worth watching',
  'this is giving me Elden Ring vibes but better',
  'that parry timing was CLEAN','POG POG POG','Kreygasm those graphics',
  'the skill tree looks insane','please do a build guide after this',
  'chat is so fast I cant read it lol','is this open world or linear?',
  'that dodge animation is smooth af','the environment detail is crazy',
  'F in chat for that fall damage 💀','OMEGALUL',
  'how many hours in so far?','this combat is chef kiss 🤌',
  'bro just casually soloing that','we eating good with this game fr',
];

const emotes   = ['🔥','💀','⚔️','🛡️','👑','🏆','💥','✨','😂','🤌','👀','🎮'];
const subNames = ['AzureDawn_','RedSandX','MirrorBlade','ChaosRunner','NeonWarden'];

const eventConfig = {
  death:   { cls:'event-death',   label: n => `💀 STREAMER DIED — Death #${n}`,          prompt: n => `You are a Twitch chat viewer watching a Crimson Desert stream. The streamer just died in-game for the ${n}th time. React with a short, funny, savage or sympathetic comment. Under 15 words, casual Twitch tone, max 1 emoji. The more deaths the more savage. Never mention being an AI.` },
  kill:    { cls:'event-kill',    label: n => `⚔️ KILL! — ${n} kills this session`,       prompt: n => `You are a Twitch chat viewer watching a Crimson Desert stream. The streamer just got a kill, ${n} kills total this session. Short hype or funny reaction. Under 15 words, max 1 emoji. Never mention being an AI.` },
  mission: { cls:'event-mission', label: n => `✅ MISSION COMPLETE — #${n} this stream`,  prompt: n => `You are a Twitch chat viewer watching a Crimson Desert stream. The streamer just completed mission #${n}. Short hyped or funny reaction. Under 15 words, max 1 emoji. Never mention being an AI.` },
  boss:    { cls:'event-boss',    label: n => `👑 BOSS DEFEATED — #${n} down!`,           prompt: n => `You are a Twitch chat viewer watching a Crimson Desert stream. The streamer just defeated boss #${n}. Extremely hyped or funny reaction. Under 15 words, max 1 emoji. Never mention being an AI.` },
};

function rand(arr)         { return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }
function escHtml(s)        { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function addMsg(user, text, isHighlight, extraClass) {
  const div = document.createElement('div');
  let cls = 'msg';
  if (isHighlight) cls += ' highlight';
  if (extraClass)  cls += ' ' + extraClass;
  div.className = cls;
  let inner = '';
  if (user.badge === 'mod') inner += '<span class="badge badge-mod">MOD</span>';
  else if (user.badge === 'sub') inner += '<span class="badge badge-sub">SUB</span>';
  else if (user.badge === 'vip') inner += '<span class="badge badge-vip">VIP</span>';
  else if (user.badge === 'you') inner += '<span class="badge badge-you">YOU</span>';
  inner += '<span class="username" style="color:' + user.color + '">' + escHtml(user.name) + '</span>';
  inner += '<span class="colon">:</span>';
  inner += '<span class="text">' + escHtml(text) + '</span>';
  div.innerHTML = inner;
  messagesEl.appendChild(div);
  trimMessages(); doScroll();
  return div;
}

function addSystem(text, isRaid) {
  const div = document.createElement('div');
  div.className = isRaid ? 'raid-msg' : 'system-msg';
  div.textContent = text;
  messagesEl.appendChild(div);
  trimMessages(); doScroll();
}

function addEventAnnounce(text, cls) {
  const div = document.createElement('div');
  div.className = 'event-announce ' + cls;
  div.textContent = text;
  messagesEl.appendChild(div);
  trimMessages(); doScroll();
}

function showTypingIndicator(username, color) {
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.innerHTML =
    '<span style="font-size:12px;font-weight:700;color:' + color + '">' + escHtml(username) + '</span>' +
    '<div class="typing-dots"><span></span><span></span><span></span></div>' +
    '<span class="typing-label">typing...</span>';
  messagesEl.appendChild(div);
  doScroll();
  return div;
}

function removeTypingIndicator(div) { if (div && div.parentNode) div.parentNode.removeChild(div); }
function trimMessages() { while (messagesEl.children.length > 250) messagesEl.removeChild(messagesEl.children[0]); }

function doScroll() {
  if (autoScroll) messagesEl.scrollTop = messagesEl.scrollHeight;
  else scrollBtn.style.display = 'block';
}

function scrollToBottom() {
  autoScroll = true;
  messagesEl.scrollTop = messagesEl.scrollHeight;
  scrollBtn.style.display = 'none';
}

messagesEl.addEventListener('scroll', function() {
  const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 50;
  if (atBottom) { autoScroll = true; scrollBtn.style.display = 'none'; }
  else autoScroll = false;
});

// ── LISTEN FOR EVENTS FROM CONTROL PANEL VIA localStorage ──
// ── GAME EVENT LISTENER (localStorage) ──
window.addEventListener('storage', function(e) {
  if (e.key === 'cd_event' && e.newValue) {
    try {
      const { type, n } = JSON.parse(e.newValue);
      handleGameEvent(type, n);
    } catch(err) {}
  }
});

// ── VOICE LISTENER (BroadcastChannel) ──
try {
  const voiceChannel = new BroadcastChannel('cd_voice_channel');
  voiceChannel.onmessage = function(e) {
    try {
      const { text, showText } = e.data;
      if (!text || !text.trim()) return;
      isReplying = false;
      if (inputEl) inputEl.disabled = false;
      if (sendBtn) sendBtn.disabled = false;
      if (showText) addMsg({ name: STREAMER_NAME, color: '#ff9955', badge: 'you' }, text.trim(), true);
      triggerAIReplies(text.trim());
    } catch(err) { console.warn('Voice message error:', err); }
  };
} catch(e) {
  console.warn('BroadcastChannel not available:', e);
}

async function handleGameEvent(type, n) {
  if (isReplying) return;
  const cfg = eventConfig[type];
  if (!cfg) return;
  addEventAnnounce(cfg.label(n), cfg.cls);
  isReplying = true;
  inputEl.disabled = true;
  sendBtn.disabled = true;

  const shuffled = [...users].sort(() => Math.random() - 0.5);
  const replyUsers = shuffled.slice(0, randInt(3, 5));

  for (let i = 0; i < replyUsers.length; i++) {
    const u = replyUsers[i];
    await new Promise(r => setTimeout(r, randInt(400, 1100) * (i + 1)));
    const typingDiv = showTypingIndicator(u.name, u.color);
    await new Promise(r => setTimeout(r, randInt(900, 2000)));
    removeTypingIndicator(typingDiv);
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': getApiKey(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-inaccessible': '' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 60,
          system: cfg.prompt(n),
          messages: [{ role: 'user', content: 'React as viewer ' + u.name + ':' }]
        })
      });
      const data = await res.json();
      const txt = data.content?.[0]?.text?.trim().replace(/^["']|["']$/g,'') ?? rand(chatLines);
      addMsg(u, txt, false, 'reply-msg');
    } catch(e) {
      addMsg(u, rand(chatLines), false, 'reply-msg');
    }
  }

  isReplying = false;
  inputEl.disabled = false;
  sendBtn.disabled = false;
}

async function triggerAIReplies(streamerMsg) {
  isReplying = true;
  inputEl.disabled = true;
  sendBtn.disabled = true;

  const shuffled = [...users].sort(() => Math.random() - 0.5);
  const replyUsers = shuffled.slice(0, randInt(2, 4));

  const systemPrompt = `You are simulating a Twitch live chat audience watching a Crimson Desert gameplay stream. The streamer just said something in chat. Generate a short, authentic chat reply from a viewer. Rules:
- Keep it under 15 words
- Sound like a real Twitch viewer: casual, hyped, supportive, or funny
- You may use 1 emoji max
- No hashtags, no punctuation at end unless it's ! or ?
- React directly to what the streamer said
- Never mention being an AI`;

  for (let i = 0; i < replyUsers.length; i++) {
    const u = replyUsers[i];
    await new Promise(r => setTimeout(r, randInt(800, 2200) * (i + 1)));
    const typingDiv = showTypingIndicator(u.name, u.color);
    await new Promise(r => setTimeout(r, randInt(1200, 2500)));
    removeTypingIndicator(typingDiv);
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': getApiKey(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-inaccessible': '' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 60,
          system: systemPrompt,
          messages: [{ role: 'user', content: 'Streamer said: "' + streamerMsg + '". Reply as viewer ' + u.name + ':' }]
        })
      });
      const data = await res.json();
      if (data.error) { addMsg(u, rand(chatLines), false, 'reply-msg'); continue; }
      const replyText = data.content?.[0]?.text?.trim().replace(/^["']|["']$/g,'') ?? rand(chatLines);
      addMsg(u, replyText, false, 'reply-msg');
    } catch(e) {
      addMsg(u, rand(chatLines), false, 'reply-msg');
    }
  }

  isReplying = false;
  inputEl.disabled = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

// Direct send — used by voice (bypasses input field)
function sendUserMsgDirect(val) {
  if (!val || !val.trim()) return;
  addMsg({ name: STREAMER_NAME, color: '#ff9955', badge: 'you' }, val.trim(), true);
  triggerAIReplies(val.trim());
}

function sendUserMsg() {
  const val = inputEl.value.trim();
  if (!val || isReplying) return;
  addMsg({ name: STREAMER_NAME, color: '#ff9955', badge: 'you' }, val, true);
  inputEl.value = '';
  triggerAIReplies(val);
}

inputEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendUserMsg(); });

// ── CHAT EVENT STYLES ──
const styleEl = document.createElement('style');
styleEl.textContent = `
  .alert-msg {
    font-size:12px; text-align:center; padding:6px 10px;
    border-radius:4px; margin:4px 0; animation:fadeIn 0.4s ease;
    font-weight:700; letter-spacing:0.3px;
  }
  .alert-sub    { background:rgba(140,60,220,0.2); border:1px solid rgba(180,80,255,0.4); color:#dd99ff; }

`;

// ── BAN — rude message appears, gets deleted, ban alert ──
function spawnBan() {

  // 1. Rude message appears
  const rudeDiv = addMsg(rudeUser, rudeMsg);

// ── RANDOM EVENT SCHEDULER ──
// Picks a weighted random chat event and schedules the next one
function scheduleRandomEvent() {
  const events = [
    { fn: spawnSub,         weight: 30 },
    { fn: spawnGiftedSubs,  weight: 15 },
    { fn: spawnBan,         weight: 25 },
    { fn: spawnTimeout,     weight: 25 },
    { fn: spawnBits,        weight: 18 },
  ];
  const total = events.reduce((s, e) => s + e.weight, 0);
  let r = Math.random() * total;
  for (const e of events) { r -= e.weight; if (r <= 0) { e.fn(); break; } }
  // next event in 15–45 seconds
  setTimeout(scheduleRandomEvent, randInt(20000, 35000));
}

function saveApiKey() {
  const val = document.getElementById('api-key-input').value.trim();
  if (!val.startsWith('sk-ant-')) {
    document.getElementById('api-error').style.display = 'block';
